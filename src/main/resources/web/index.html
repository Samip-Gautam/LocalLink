<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LAN Share</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<main class="panel">

    <header class="panel__head">
        <span class="status">
            <span class="status__dot" aria-hidden="true"></span>
            On your network
        </span>
        <h1>LAN Share</h1>
    </header>

    <form class="dropzone" id="upload-form">

        <input
                type="file"
                id="file"
                name="file"
                class="dropzone__input"
                multiple
                required
        >

        <label for="file" class="dropzone__label">
            <svg class="dropzone__icon" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                <path d="M14 18V6M14 6L9 11M14 6L19 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 20V21.5C5 22.6 5.9 23.5 7 23.5H21C22.1 23.5 23 22.6 23 21.5V20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="dropzone__title" id="dropzone-title">Drop files or photos, or click to browse</span>
            <span class="dropzone__hint">Pick as many as you like, sends straight to the other device</span>
        </label>

        <button type="submit" class="dropzone__submit">Send</button>

    </form>

    <div class="divider"><span>connect a device</span></div>

    <section class="connect">

        <div class="connect__link">
            <span class="connect__label">Open on the other device</span>
            <div class="linkbox">
                <code id="share-url">Loading…</code>
                <button type="button" class="copy-btn" id="copy-btn" aria-label="Copy link">
                    <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                        <rect x="5.5" y="5.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                        <path d="M2.5 9.5V3.5C2.5 2.9 2.9 2.5 3.5 2.5H9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                    <span>Copy</span>
                </button>
            </div>
        </div>

        <div class="connect__qr">
            <span class="connect__label">Or scan to open</span>
            <div class="scanframe" id="qr">
                <span class="scanframe__placeholder">
                    <img src="/qr" alt="QR code to open this page" class="scanframe__img">
                </span>
            </div>
        </div>

    </section>

    <div class="files" id="files"></div>

</main>

<script>
    const copyBtn = document.getElementById('copy-btn');
    const shareUrl = document.getElementById('share-url');

    fetch('/info')
        .then(r => r.json())
        .then(({ ip, port }) => {
            shareUrl.textContent = `http://${ip}:${port}/`;
        })
        .catch(() => {});

    copyBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(shareUrl.textContent.trim());
            const label = copyBtn.querySelector('span');
            const original = label.textContent;
            copyBtn.classList.add('copy-btn--done');
            label.textContent = 'Copied';
            setTimeout(() => {
                copyBtn.classList.remove('copy-btn--done');
                label.textContent = original;
            }, 1600);
        } catch (err) {
        }
    });

    const fileInput = document.getElementById('file');
    const dropzoneTitle = document.getElementById('dropzone-title');
    const dropzone = document.querySelector('.dropzone');
    const defaultTitle = dropzoneTitle.textContent;
    const filesList = document.getElementById('files');

    function labelForSelection(files) {
        if (files.length === 0) return defaultTitle;
        if (files.length === 1) return files[0].name;
        return `${files.length} files selected`;
    }

    fileInput.addEventListener('change', () => {
        dropzoneTitle.textContent = labelForSelection(fileInput.files);
    });

    ['dragenter', 'dragover'].forEach(evt =>
        dropzone.addEventListener(evt, (e) => {
            e.preventDefault();
            dropzone.classList.add('dropzone--active');
        })
    );

    ['dragleave', 'drop'].forEach(evt =>
        dropzone.addEventListener(evt, (e) => {
            e.preventDefault();
            dropzone.classList.remove('dropzone--active');
        })
    );

    dropzone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            dropzoneTitle.textContent = labelForSelection(fileInput.files);
        }
    });

    function renderFiles(names) {
        if (names.length === 0) {
            filesList.innerHTML = '<span class="files__empty">No files shared yet</span>';
            return;
        }

        filesList.innerHTML = names
            .map(name => `
                <div class="file-row">
                    <a class="download-link" href="/download?name=${encodeURIComponent(name)}">${name}</a>
                </div>
            `)
            .join('');
    }

    async function refreshFiles() {
        try {
            const res = await fetch('/files');
            renderFiles(await res.json());
        } catch (err) {
            filesList.innerHTML = '<span class="files__empty">Could not load shared files</span>';
        }
    }

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const files = Array.from(fileInput.files);
        if (files.length === 0) return;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            dropzoneTitle.textContent = `Sending ${file.name} (${i + 1}/${files.length})...`;

            try {
                const res = await fetch(`/upload?name=${encodeURIComponent(file.name)}`, {
                    method: 'POST',
                    body: file
                });

                if (!res.ok) {
                    dropzoneTitle.textContent = `Failed on ${file.name}`;
                    return;
                }
            } catch (err) {
                dropzoneTitle.textContent = `Failed on ${file.name}`;
                return;
            }
        }

        dropzoneTitle.textContent = files.length === 1
            ? `Sent: ${files[0].name}`
            : `Sent ${files.length} files`;

        refreshFiles();
    });

    refreshFiles();
</script>

</body>
</html>
