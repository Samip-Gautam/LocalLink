<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LAN Share</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<main class="panel">

    <header class="panel__head">
        <span class="status">
            <span class="status__dot" aria-hidden="true"></span>
            On your network
        </span>
        <h1>LAN Share</h1>
    </header>

    <form class="dropzone" id="upload-form">

        <input
                type="file"
                id="file"
                name="file"
                class="dropzone__input"
                required
        >

        <label for="file" class="dropzone__label">
            <svg class="dropzone__icon" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                <path d="M14 18V6M14 6L9 11M14 6L19 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 20V21.5C5 22.6 5.9 23.5 7 23.5H21C22.1 23.5 23 22.6 23 21.5V20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="dropzone__title" id="dropzone-title">Drop a file, or click to browse</span>
            <span class="dropzone__hint">Sends straight to the other device</span>
        </label>

        <button type="submit" class="dropzone__submit">Send file</button>

    </form>

    <div class="divider"><span>connect a device</span></div>

    <section class="connect">

        <div class="connect__link">
            <span class="connect__label">Open on the other device</span>
            <div class="linkbox">
                <code id="share-url">http://10.22.19.141:8080/</code>
                <button type="button" class="copy-btn" id="copy-btn" aria-label="Copy link">
                    <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                        <rect x="5.5" y="5.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                        <path d="M2.5 9.5V3.5C2.5 2.9 2.9 2.5 3.5 2.5H9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                    <span>Copy</span>
                </button>
            </div>
        </div>

        <div class="connect__qr">
            <span class="connect__label">Or scan to open</span>
            <div class="scanframe" id="qr">
                <!-- QR not implemented yet -->
                <span class="scanframe__placeholder">QR</span>
            </div>
        </div>

    </section>

    <a class="download-link" href="/download" id="download-link">Download shared file</a>

</main>

<script>
    const copyBtn = document.getElementById('copy-btn');
    const shareUrl = document.getElementById('share-url');

    // Fill in the real LAN address from the server
    fetch('/info')
        .then(r => r.json())
        .then(({ ip, port }) => {
            shareUrl.textContent = `http://${ip}:${port}/`;
        })
        .catch(() => { /* keep placeholder if /info is unreachable */ });

    copyBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(shareUrl.textContent.trim());
            const label = copyBtn.querySelector('span');
            const original = label.textContent;
            copyBtn.classList.add('copy-btn--done');
            label.textContent = 'Copied';
            setTimeout(() => {
                copyBtn.classList.remove('copy-btn--done');
                label.textContent = original;
            }, 1600);
        } catch (err) {
            /* Clipboard API unavailable — link remains selectable as text */
        }
    });

    const fileInput = document.getElementById('file');
    const dropzoneTitle = document.getElementById('dropzone-title');
    const dropzone = document.querySelector('.dropzone');
    const defaultTitle = dropzoneTitle.textContent;

    fileInput.addEventListener('change', () => {
        dropzoneTitle.textContent = fileInput.files[0] ? fileInput.files[0].name : defaultTitle;
    });

    ['dragenter', 'dragover'].forEach(evt =>
        dropzone.addEventListener(evt, (e) => {
            e.preventDefault();
            dropzone.classList.add('dropzone--active');
        })
    );

    ['dragleave', 'drop'].forEach(evt =>
        dropzone.addEventListener(evt, (e) => {
            e.preventDefault();
            dropzone.classList.remove('dropzone--active');
        })
    );

    dropzone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            dropzoneTitle.textContent = e.dataTransfer.files[0].name;
        }
    });

    // Raw upload: server reads the request body directly as file bytes
    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const file = fileInput.files[0];
        if (!file) return;

        dropzoneTitle.textContent = `Sending ${file.name}...`;

        try {
            const res = await fetch('/upload', { method: 'POST', body: file });
            dropzoneTitle.textContent = res.ok ? `Sent: ${file.name}` : 'Upload failed';
        } catch (err) {
            dropzoneTitle.textContent = 'Upload failed';
        }
    });
</script>

</body>
</html>
